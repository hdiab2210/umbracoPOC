<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
  <h1>{{ 'auth.loginTitle' | translate }}</h1>
  <p>{{ 'auth.loginSubtitle' | translate }}</p>

  <label>
    {{ 'auth.email' | translate }}
    <input type="email" formControlName="email" autocomplete="email" />
  </label>
  @if (form.controls.email.touched && form.controls.email.invalid) {
    <small class="error">{{ 'auth.emailInvalid' | translate }}</small>
  }

  <label>
    {{ 'auth.password' | translate }}
    <input type="password" formControlName="password" autocomplete="current-password" />
  </label>

  <label class="inline">
    <input type="checkbox" formControlName="rememberMe" />
    {{ 'auth.rememberMe' | translate }}
  </label>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <button type="submit" [disabled]="loading()">
    {{ (loading() ? 'common.loading' : 'auth.loginButton') | translate }}
  </button>

  <p>{{ 'auth.noAccount' | translate }} <a routerLink="/signup">{{ 'auth.signupLink' | translate }}</a></p>
</form>
