<app-page-header
  [eyebrow]="'nav.news' | translate"
  [title]="page()?.properties?.title || ('news.title' | translate)"
  [intro]="'news.intro' | translate"
/>

<section class="container section">
  @if (loading()) {
    <app-card-skeleton [count]="6" />
  } @else if (error()) {
    <p class="alert alert--error">{{ error() }}</p>
  } @else {
    <div class="card-grid">
      @for (item of items(); track item.id) {
        <app-news-card [item]="item" />
      } @empty {
        <p class="empty-state">{{ 'news.empty' | translate }}</p>
      }
    </div>
  }
</section>
